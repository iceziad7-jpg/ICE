<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        .back-btn {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .submit-btn:active {
            transform: scale(0.95);
        }
        
        .social {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        
        .social a {
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            font-size: 24px;
            transition: 0.3s;
        }
        
        .social a:active {
            transform: scale(0.9);
        }
        
        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
        
        <h1>📧 تواصل معنا</h1>
        
        <form onsubmit="sendMessage(event)">
            <div class="form-group">
                <label>الاسم:</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="form-group">
                <label>البريد الإلكتروني:</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label>الموضوع:</label>
                <input type="text" id="subject" required>
            </div>
            
            <div class="form-group">
                <label>الرسالة:</label>
                <textarea id="message" required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">
                إرسال الرسالة ✉️
            </button>
        </form>
        
        <div class="info">
            <p>أو تواصل معنا عبر:</p>
            <p style="margin-top: 10px; font-weight: bold; color: #667eea;">
                📱 WhatsApp: 01XXXXXXXXX<br>
                📧 Email: studio@example.com
            </p>
        </div>
        
        <div class="social">
            <a href="https://instagram.com" target="_blank">📷</a>
            <a href="https://twitter.com" target="_blank">🐦</a>
            <a href="https://youtube.com" target="_blank">▶️</a>
            <a href="https://facebook.com" target="_blank">📘</a>
        </div>
    </div>
    
    <script>
        function sendMessage(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            
            // إنشاء رسالة WhatsApp
            const whatsappMsg = `مرحباً! أنا ${name}\n\nالموضوع: ${subject}\n\nالرسالة: ${message}\n\nالبريد: ${email}`;
            const whatsappUrl = `https://wa.me/201XXXXXXXXX?text=${encodeURIComponent(whatsappMsg)}`;
            
            // فتح WhatsApp
            window.open(whatsappUrl, '_blank');
            
            alert('✅ سيتم تحويلك إلى WhatsApp لإرسال الرسالة!');
        }
    </script>
</body>
</html>
