<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحلقات والأعمال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }
        
        .back-btn {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            margin-bottom: 30px;
        }
        
        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .video-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }
        
        .video-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .video-info {
            padding: 20px;
        }
        
        .video-title {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .video-desc {
            opacity: 0.7;
            font-size: 14px;
            line-height: 1.5;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }
            
            .videos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← الرئيسية</a>
    
    <h1>🎬 الحلقات والأعمال</h1>
    
    <div class="videos">
        <!-- فيديو 1 -->
        <div class="video-card">
            <div class="video-wrapper">
                <!-- ضع كود YouTube هنا -->
                <iframe 
                    src="https://www.youtube.com/embed/YOUR_VIDEO_ID" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">
                <h3 class="video-title">الحلقة 1 - البداية</h3>
                <p class="video-desc">أول حلقة من مسلسلنا الجديد المليء بالإثارة والمغامرات</p>
            </div>
        </div>
        
        <!-- فيديو 2 -->
        <div class="video-card">
            <div class="video-wrapper">
                <iframe 
                    src="https://www.youtube.com/embed/YOUR_VIDEO_ID" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">
                <h3 class="video-title">الحلقة 2 - الصراع</h3>
                <p class="video-desc">تستمر المغامرة مع تحديات جديدة ومثيرة</p>
            </div>
        </div>
        
        <!-- أضف المزيد... -->
    </div>
</body>
  </html>
